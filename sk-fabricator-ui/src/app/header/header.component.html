<header class="bg-gray-900/80 backdrop-blur-sm shadow-lg sticky top-0 z-50 transition-all duration-300">
  <div class="container mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <a routerLink="/" class="flex items-center space-x-3">
        <img src="assets/sk_logo.png" alt="SK Fabricator & Erector Logo" class="h-10 w-auto">
        <span class="text-2xl font-bold text-white tracking-wider">SK Fabricator</span>
      </a>

      <!-- Desktop Navigation -->
      <nav class="hidden md:flex items-center space-x-2">
        @for (item of navItems; track item.label) {
          <a [routerLink]="item.link"
             routerLinkActive="bg-gray-700 text-white"
             [routerLinkActiveOptions]="{ exact: item.link === '/' }"
             class="text-gray-300 hover:bg-gray-800 hover:text-white px-4 py-2 rounded-md text-sm font-medium transition-colors duration-200">
            {{ item.label }}
          </a>
        }
      </nav>

      <div class="hidden md:flex items-center space-x-4">
        <a routerLink="/admin"
           class="bg-blue-600 text-white px-5 py-2 rounded-full text-sm font-semibold hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-transform duration-200 transform hover:scale-105 shadow-md">
          Admin Login
        </a>
      </div>

      <!-- Mobile Menu Button -->
      <div class="md:hidden">
        <button (click)="isMenuOpen = !isMenuOpen" class="text-gray-400 hover:text-white focus:outline-none">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            @if (!isMenuOpen) {
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
            } @else {
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            }
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div class="mobile-menu md:hidden" [class.open]="isMenuOpen">
    <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3">
      @for (item of navItems; track item.label) {
        <a [routerLink]="item.link"
           routerLinkActive="bg-gray-700 text-white"
           (click)="isMenuOpen = false"
           class="text-gray-300 hover:bg-gray-800 hover:text-white block px-3 py-2 rounded-md text-base font-medium transition-colors duration-200">
          {{ item.label }}
        </a>
      }
    </div>
    <div class="border-t border-gray-700 pt-4 pb-3">
      <div class="flex items-center px-5">
        <a routerLink="/admin" (click)="isMenuOpen = false"
           class="w-full text-center bg-blue-600 text-white px-4 py-2 rounded-md text-base font-semibold hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors duration-200">
          Admin Login
        </a>
      </div>
    </div>
  </div>
</header>
