<div class="clients-container">
  <div class="header-container">
    <h2>Our Clients</h2>
    <button *ngIf="isAdminOrManager()" (click)="toggleAddClientForm()" class="btn btn-primary">
      {{ showAddClientForm() ? 'Cancel' : 'Add New Client' }}
    </button>
  </div>

  <div *ngIf="showAddClientForm()" class="add-client-form card">
    <form #addClientForm="ngForm" (ngSubmit)="onAddClient(addClientForm, fileInput.files)">
      <div class="form-group">
        <label for="name">Client Name</label>
        <input type="text" id="name" name="name" [(ngModel)]="newClient.name" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="clientUrl">Client URL</label>
        <input type="text" id="clientUrl" name="clientUrl" [(ngModel)]="newClient.clientUrl" class="form-control">
      </div>
      <div class="form-group">
        <label for="file">Client Image</label>
        <input type="file" #fileInput id="file" name="file" class="form-control">
      </div>
      <button type="submit" class="btn btn-success" [disabled]="addClientForm.invalid">Add Client</button>
    </form>
  </div>

  <div class="clients-grid">
    <div *ngFor="let client of clients()" class="client-card card">
      <a [href]="client.clientUrl" target="_blank" rel="noopener noreferrer">
        <img [src]="client.imageUrl" [alt]="client.name" class="client-image">
        <div class="client-name">{{ client.name }}</div>
      </a>
      <div *ngIf="isAdminOrManager()" class="admin-actions">
        <button (click)="startEdit(client)" class="btn btn-sm btn-warning">Edit</button>
        <button (click)="onDeleteClient(client.id)" class="btn btn-sm btn-danger">Delete</button>
      </div>

      <div *ngIf="editClient()?.id === client.id" class="edit-form card">
        <form #editClientForm="ngForm" (ngSubmit)="onUpdateClient()">
          <div class="form-group">
            <label for="edit-name">Name</label>
            <input type="text" id="edit-name" name="name" [(ngModel)]="editClient()!.name" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="edit-clientUrl">Client URL</label>
            <input type="text" id="edit-clientUrl" name="clientUrl" [(ngModel)]="editClient()!.clientUrl" class="form-control">
          </div>
          <div class="form-group">
            <label for="edit-file">New Image</label>
            <input type="file" #editFileInput (change)="onImageUpload(client.id, editFileInput.files)" class="form-control">
          </div>
          <button type="submit" class="btn btn-success">Save</button>
          <button type="button" (click)="cancelEdit()" class="btn btn-secondary">Cancel</button>
        </form>
      </div>
    </div>
  </div>
</div>
