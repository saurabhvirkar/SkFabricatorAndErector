<div class="admin-login-page bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="container mx-auto px-4 sm:px-6 lg:px-8">
    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-2xl overflow-hidden">
      <div class="bg-gray-900 px-10 py-8">
        <h2 class="text-3xl font-extrabold text-white text-center">Admin Login</h2>
        <p class="text-center text-gray-300 mt-2">Access the site management dashboard.</p>
      </div>
      <div class="p-10">
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
          <!-- Username -->
          <div class="relative">
            <input id="username" type="text" formControlName="username" placeholder="Username"
                   class="peer w-full px-4 py-3 border-2 border-gray-200 rounded-lg text-gray-900 placeholder-transparent focus:outline-none focus:border-blue-600 transition-all">
            <label for="username" class="absolute left-4 -top-3.5 text-gray-600 text-sm transition-all peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-400 peer-placeholder-shown:top-3.5 peer-focus:-top-3.5 peer-focus:text-blue-600 peer-focus:text-sm">Username</label>
            <div *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched" class="mt-2 text-sm text-red-600">
              Username is required.
            </div>
          </div>

          <!-- Password -->
          <div class="relative">
            <input id="password" type="password" formControlName="password" placeholder="Password"
                   class="peer w-full px-4 py-3 border-2 border-gray-200 rounded-lg text-gray-900 placeholder-transparent focus:outline-none focus:border-blue-600 transition-all">
            <label for="password" class="absolute left-4 -top-3.5 text-gray-600 text-sm transition-all peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-400 peer-placeholder-shown:top-3.5 peer-focus:-top-3.5 peer-focus:text-blue-600 peer-focus:text-sm">Password</label>
            <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="mt-2 text-sm text-red-600">
              Password is required.
            </div>
          </div>

          <!-- Submission Button -->
          <button type="submit" [disabled]="submissionStatus() === 'loading'"
                  class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-lg text-lg font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50 transition-all duration-300 transform hover:scale-105">
            @if (submissionStatus() === 'loading') {
              <span>Logging In...</span>
            } @else {
              <span>Sign In</span>
            }
          </button>

          <!-- Status Message -->
          @if (responseMessage()) {
            <div [ngClass]="{
              'bg-green-100 border-green-400 text-green-700': submissionStatus() === 'success',
              'bg-red-100 border-red-400 text-red-700': submissionStatus() === 'error'
            }" class="p-4 border-l-4 rounded-lg mt-4" role="alert">
              <p>{{ responseMessage() }}</p>
            </div>
          }
        </form>
      </div>
    </div>
  </div>
</div>
