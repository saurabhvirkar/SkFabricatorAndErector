
    <div class="flex items-center justify-center min-h-screen bg-gray-100 pt-16">
      <div class="w-full max-w-md p-8 space-y-6 bg-white rounded-lg shadow-md">
        <h2 class="text-2xl font-bold text-center text-gray-900">Admin Login</h2>
        <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
          <div class="space-y-4">
            <div>
              <label for="email" class="text-sm font-medium text-gray-700">Email</label>
              <input id="email" type="email" formControlName="email" required
                     class="w-full px-3 py-2 mt-1 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div>
              <label for="password" class="text-sm font-medium text-gray-700">Password</label>
              <input id="password" type="password" formControlName="password" required
                     class="w-full px-3 py-2 mt-1 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
            </div>
          </div>
          @if (responseMessage(); as message) {
            <p class="mt-4 text-sm text-center text-red-600">{{ message }}</p>
          }
          <button type="submit" [disabled]="loginForm.invalid"
                  class="w-full px-4 py-2 mt-6 font-semibold text-white bg-indigo-600 rounded-md hover:bg-indigo-700 disabled:bg-gray-400">
            Sign In
          </button>
        </form>
      </div>
    </div>
