<div class="section-image-management-page min-w-full">
  <main class="py-20 bg-gray-50">
    <div class="container mx-auto px-4 sm:px-6 lg:px-8">

      @if (isLoggedIn() && isAdminOrManager()) {
        <div class="upload-section bg-white p-6 rounded-lg shadow-md mb-10">
          <h2 class="text-2xl font-bold text-gray-800 mb-4">Upload New Image for {{ sectionName }}</h2>
          <input type="file" id="fileUpload" (change)="onFileSelected($event)" class="block w-full text-sm text-gray-500
            file:mr-4 file:py-2 file:px-4
            file:rounded-full file:border-0
            file:text-sm file:font-semibold
            file:bg-blue-50 file:text-blue-700
            hover:file:bg-blue-100
          "/>
          <button (click)="onUpload()" [disabled]="!selectedFile" class="mt-4 px-6 py-2 bg-green-600 text-white font-semibold rounded-md shadow-md hover:bg-green-700 transition duration-300 disabled:opacity-50">
            Upload Image
          </button>
        </div>
      }
      
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        @for (image of images(); track image.id) {
          <div class="rounded-xl shadow-lg overflow-hidden relative group cursor-pointer hover:shadow-2xl transition duration-300">
            <img [src]="image.url" alt="Section Image"
                 class="w-full h-64 object-cover transition duration-500 group-hover:scale-105">
            
            <div class="absolute inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center opacity-0 group-hover:opacity-100 transition duration-300">
              <div class="text-white text-center p-4">
                <p class="text-xl font-bold">{{ image.sectionName }}</p>
              </div>
            </div>

            @if (isLoggedIn() && isAdminOrManager()) {
              <button (click)="onDeleteImage(image.id)" class="absolute top-2 right-2 bg-red-600 text-white p-2 rounded-full shadow-lg hover:bg-red-700 transition duration-300" aria-label="Delete Image">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                  <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm6 0a1 1 0 11-2 0v6a1 1 0 112 0V8z" clip-rule="evenodd" />
                </svg>
              </button>
            }
          </div>
        } @empty {
          <div class="col-span-full text-center py-10 text-gray-500 text-lg">
            No images found for the '{{ sectionName }}' section.
          </div>
        }
      </div>
    </div>
  </main>
</div>
