services:
  - type: web
    name: skfabricatorapi
    env: docker
    dockerfilePath: SkFabricatorApi/Dockerfile
    healthCheckPath: /health
    ports:
      - 10000
    envVars:
      - key: ConnectionStrings__DefaultConnection
        value: Host=dpg-d45iievdiees7389up0g-a.singapore-postgres.render.com;Port=5432;Database=skfabricatordb;Username=skfabricatordb_user;Password=iWQWI4mq2VqeXEsu2kLz4RG6PHEzjjpL
      - key: Jwt__Issuer
        value: http://skfabricatorapi:10000
      - key: Jwt__Audience
        value: http://skfabricatorui:80
      - key: Jwt__Key
